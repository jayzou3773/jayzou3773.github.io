title: "Jay (Xinkai) Zou"
baseURL: "https://jayzou3773.github.io/"
locale: en-us
enableRobotsTXT: true
enableEmoji: true
disableKinds: [taxonomy, term, RSS]
params:
  description: "Jay (Xinkai) Zou — AI for simulation and efficient AI."
  author: Xinkai Zou
outputs:
  home: [HTML]
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: false
  tableOfContents:
    startLevel: 2
    endLevel: 4
module:
  mounts:
    - source: static
      target: static
    - source: images
      target: static/images
    - source: assets
      target: assets
    - source: layouts
      target: layouts
    - source: content
      target: content
